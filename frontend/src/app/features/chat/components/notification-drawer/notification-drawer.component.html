<div
  *ngIf="notificationService.isNotificationDrawerOpen()"
  class="drawer-backdrop"
  (click)="notificationService.toggleNotificationDrawer(false)"
>
  <div class="notif-drawer-panel" (click)="$event.stopPropagation()">
    <div class="notif-drawer-header">
      <div class="notif-header-title-wrap">
        <img src="/icons/chat.svg" class="icon-img-sm" alt="Notifications" />
        <h3>Notifications</h3>
        <span *ngIf="notificationService.unreadNotificationCount() > 0" class="badge badge-info">
          {{ notificationService.unreadNotificationCount() }} new
        </span>
      </div>

      <div class="notif-header-actions">
        <button
          *ngIf="notificationService.unreadNotificationCount() > 0"
          (click)="notificationService.markAllAsRead()"
          class="btn-text-sm"
          title="Mark all as read"
        >
          Mark all read
        </button>
        <button (click)="notificationService.toggleNotificationDrawer(false)" class="btn-icon-sm" title="Close">
          &times;
        </button>
      </div>
    </div>

    <div class="notif-drawer-list">
      <div *ngIf="notificationService.notificationHistory().length === 0" class="notif-empty-state">
        <div class="notif-empty-icon">
          <img src="/icons/chat.svg" class="icon-img-lg" alt="Notifications" />
        </div>
        <h4>No notifications yet</h4>
        <p>You're all caught up with your direct and group messages.</p>
      </div>

      <div
        *ngFor="let item of notificationService.notificationHistory()"
        class="notif-item-card"
        [class.unread]="!item.isRead"
        (click)="onItemClick(item)"
      >
        <div class="notif-item-avatar">
          <img *ngIf="item.avatar" [src]="item.avatar" [alt]="item.title" />
          <div *ngIf="!item.avatar" class="notif-avatar-fallback">
            <img src="/icons/chat.svg" class="icon-img-sm" alt="Notification" />
          </div>
        </div>

        <div class="notif-item-content">
          <div class="notif-item-header">
            <span class="notif-item-title">{{ item.title }}</span>
            <span class="notif-item-time">{{ item.timestamp | date:'shortTime' }}</span>
          </div>
          <p class="notif-item-msg">{{ item.message }}</p>
        </div>

        <button
          type="button"
          class="notif-item-dismiss"
          (click)="$event.stopPropagation(); notificationService.removeNotification(item.id)"
          title="Dismiss notification"
        >
          &times;
        </button>
      </div>
    </div>

    <div *ngIf="notificationService.notificationHistory().length > 0" class="notif-drawer-footer">
      <button (click)="notificationService.clearHistory()" class="btn btn-secondary btn-sm btn-block">
        Clear All Notifications
      </button>
    </div>
  </div>
</div>
