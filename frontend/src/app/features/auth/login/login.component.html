<div class="auth-wrapper">
  <div class="glass-card auth-card">
    <div class="auth-header">
      <div class="auth-icon-badge">
        <img src="/icons/chat.svg" class="icon-img-lg" alt="PulseChat" />
      </div>
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-desc">Sign in to your account to start real-time messaging</p>
    </div>

    <div *ngIf="errorMessage()" class="alert-banner">
      <img src="/icons/info.svg" class="icon-img-sm" alt="Error" />
      <span>{{ errorMessage() }}</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <div class="input-wrapper" [class.input-error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          <img src="/icons/user.svg" class="input-icon icon-img-sm" alt="Email" />
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            class="form-input"
            autocomplete="email"
          />
        </div>
        <p *ngIf="loginForm.get('email')?.errors?.['required'] && loginForm.get('email')?.touched" class="field-error">
          Email is required
        </p>
        <p *ngIf="loginForm.get('email')?.errors?.['email'] && loginForm.get('email')?.touched" class="field-error">
          Please enter a valid email address
        </p>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password" class="form-label">Password</label>
        </div>
        <div class="input-wrapper" [class.input-error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <img src="/icons/file.svg" class="input-icon icon-img-sm" alt="Password" />
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            class="form-input"
            autocomplete="current-password"
          />
          <button type="button" class="visibility-toggle" (click)="togglePassword()" aria-label="Toggle password visibility">
            <span>{{ showPassword() ? 'Hide' : 'Show' }}</span>
          </button>
        </div>
        <p *ngIf="loginForm.get('password')?.errors?.['required'] && loginForm.get('password')?.touched" class="field-error">
          Password is required
        </p>
        <p *ngIf="loginForm.get('password')?.errors?.['minlength'] && loginForm.get('password')?.touched" class="field-error">
          Password must be at least 6 characters
        </p>
      </div>

      <button type="submit" class="btn btn-primary submit-btn" [disabled]="isLoading()">
        <span *ngIf="isLoading()" class="loader-spinner"></span>
        <span>{{ isLoading() ? 'Signing in...' : 'Sign In' }}</span>
      </button>
    </form>

    <div class="auth-footer">
      <span>Don't have an account?</span>
      <a routerLink="/auth/register" class="link-highlight">Create one now</a>
    </div>
  </div>
</div>
