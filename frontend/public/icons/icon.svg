<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="deepShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Glowing background aura -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>

  <!-- Main Chat Bubble -->
  <g filter="url(#deepShadow)">
    <path d="M144 140 C144 115 165 96 192 96 L320 96 C347 96 368 115 368 140 L368 284 C368 309 347 328 320 328 L232 328 L168 384 L176 328 L160 328 C151 328 144 321 144 312 Z"
          fill="url(#bubbleGrad)" />
  </g>

  <!-- Secondary subtle bubble overlay -->
  <path d="M192 120 L320 120 C333 120 344 131 344 144 L344 160 C344 146 333 136 320 136 L192 136 C179 136 168 146 168 160 L168 144 C168 131 179 120 192 120 Z"
        fill="rgba(255,255,255,0.25)" />

  <!-- Pulse dots / sound wave elements inside bubble -->
  <circle cx="208" cy="212" r="14" fill="#ffffff" opacity="0.95"/>
  <circle cx="256" cy="212" r="14" fill="#ffffff" opacity="0.95"/>
  <circle cx="304" cy="212" r="14" fill="#ffffff" opacity="0.95"/>

  <!-- Animated-style Real-Time Waveform Accent under bubble -->
  <g stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round">
    <line x1="220" y1="420" x2="220" y2="444" opacity="0.7"/>
    <line x1="244" y1="412" x2="244" y2="452" opacity="0.9"/>
    <line x1="268" y1="400" x2="268" y2="464" opacity="1.0"/>
    <line x1="292" y1="412" x2="292" y2="452" opacity="0.9"/>
    <line x1="316" y1="420" x2="316" y2="444" opacity="0.7"/>
  </g>
</svg>
